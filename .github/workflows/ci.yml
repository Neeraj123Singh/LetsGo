name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Avoid cancelling an in-flight production deploy when another push lands on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        run: |
          npm ci
          npm run build

  meeting-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/meeting-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  auth-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        working-directory: services/auth-java
        run: mvn -B test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [frontend, meeting-go, auth-java]
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker Compose stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/ >/dev/null; then
              echo "frontend up"
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for frontend"
          docker compose ps
          docker compose logs --tail=80 frontend auth-java meeting-go || true
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install e2e deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt
      - name: Install Google Chrome (for Selenium)
        run: |
          wget -nv -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || (sudo apt-get -f install -y && sudo dpkg -i /tmp/chrome.deb)
      - name: Run Selenium smoke tests
        env:
          BASE_URL: http://localhost:3000
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: pytest tests/e2e -v --tb=short
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=120

  # Opt-in CD: set repo variable DEPLOY_VIA_CI=true and configure SSH secrets (see README).
  deploy-vm:
    name: Deploy (SSH + compose prod)
    runs-on: ubuntu-latest
    needs: [e2e-smoke]
    if: >-
      vars.DEPLOY_VIA_CI == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_REPO_PATH }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            bash scripts/deploy.sh
