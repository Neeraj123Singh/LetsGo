<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Letsgo — contacts, chat, mesh video and audio calls, screen share, and invites. Secure sign-in, WebRTC-backed meetings."
    />
    <!-- Open Graph / social & search previews (replace og:url og:image via your CDN or build if you want a custom preview image). -->
    <meta property="og:title" content="Letsgo — video meetings & chat" />
    <meta property="og:description" content="Contacts, chat, group video calls, screen share, and invites in your browser." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Letsgo — video meetings & chat" />
    <meta name="twitter:description" content="Contacts, chat, group video calls, screen share, and invites in your browser." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Letsgo" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Letsgo</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      MediaPipe Selfie Segmentation is built with Google Closure Library and
      only attaches its `SelfieSegmentation` class to `window`/`globalThis`.
      Bundlers (Vite, esbuild) lose this assignment when they wrap the script
      as an ESM module, resulting in `X.SelfieSegmentation is not a constructor`.
      Loading it as a blocking <script> here guarantees `window.SelfieSegmentation`
      is set before our React module bundle runs. The `src/video/mediapipe-shim.ts`
      file then re-exports the global so `@tensorflow-models/body-segmentation`
      sees a populated module via the Vite alias defined in `vite.config.ts`.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
