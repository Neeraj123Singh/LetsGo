#cloud-config
# First-boot bootstrap for the letsgo Always-Free VM.
#
# This file is templated by Terraform — variables in ${...} are substituted at
# `terraform apply` time and the result is base64-encoded into the instance
# user_data field. Cloud-init parses it on first boot and executes everything
# below as root.
#
# After this runs, the VM has Docker, an open firewall, and the app source.
# All app-level setup (secrets, domain, deploy) happens via `make setup`
# over SSH so secrets never touch instance metadata.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - make
  - iptables-persistent
  - netfilter-persistent

write_files:
  - path: /etc/iptables/rules.v4
    permissions: "0644"
    content: |
      *filter
      :INPUT ACCEPT [0:0]
      :FORWARD ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      -A INPUT -i lo -j ACCEPT
      -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
      -A INPUT -p tcp --dport 22 -j ACCEPT
      -A INPUT -p tcp --dport 80 -j ACCEPT
      -A INPUT -p tcp --dport 443 -j ACCEPT
      -A INPUT -p udp --dport 443 -j ACCEPT
      -A INPUT -p udp --dport 3478 -j ACCEPT
      -A INPUT -p udp --dport 49160:49200 -j ACCEPT
      COMMIT

  - path: /etc/profile.d/letsgo.sh
    permissions: "0644"
    content: |
      # cd straight into the repo on login for convenience.
      if [ -d /home/ubuntu/letsgo ] && [ "$PWD" = "/home/ubuntu" ]; then
        cd /home/ubuntu/letsgo
      fi

runcmd:
  # --- Docker Engine + Compose plugin (ARM-aware) ----------------------------
  - install -m 0755 -d /etc/apt/keyrings
  - >-
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
    gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - >-
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg]
    https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
    | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - >-
    apt-get install -y
    docker-ce docker-ce-cli containerd.io
    docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu

  # --- Firewall ---------------------------------------------------------------
  - iptables-restore < /etc/iptables/rules.v4
  - netfilter-persistent save

  # --- Source ----------------------------------------------------------------
  - >-
    sudo -u ubuntu -H git clone --branch ${git_repo_branch}
    ${git_repo_url} /home/ubuntu/letsgo

  # --- Sentinel file so callers can detect "ready" ----------------------------
  - touch /var/lib/cloud/instance/letsgo-bootstrap-complete

final_message: "letsgo bootstrap finished after $UPTIME seconds"
