server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/letsgo
    username: letsgo
    password: letsgo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

letsgo:
  jwt:
    secret: ${LETSGO_JWT_SECRET:changeme-letsgo-dev-secret-32chars-min!!}
    expiration-ms: ${LETSGO_JWT_EXPIRATION_MS:86400000}
  cors-allowed-origins: ${LETSGO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
