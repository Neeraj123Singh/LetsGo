# Reference turnserver.conf for the letsgo TURN service.
#
# The actual coturn invocation in `docker-compose.prod.yml` passes the
# critical flags on the command line (realm, external IP, user, port range)
# so they can be sourced from `.env.prod`. This file documents the intent and
# captures additional security hardening that does not vary by environment.
#
# coturn reads BOTH this file AND the CLI flags; CLI flags win.

# Use long-term credentials (a static username/password). This is the
# simplest production-safe option for a small private deployment. For larger
# deployments switch to the "static-auth-secret" REST API flow.
lt-cred-mech

# Listening ports. 3478 is the IANA STUN/TURN port. We only enable plain
# UDP/TCP here; clients on locked-down corporate networks may also want
# 5349/TLS — add `tls-listening-port=5349` plus cert paths to enable.
listening-port=3478

# Relay UDP port range used for client<->client media. The matching range
# must be opened in the VM's firewall. A small range keeps the firewall
# surface low while still supporting dozens of concurrent calls.
min-port=49160
max-port=49200

# Reject any unrequested addresses (basic hardening against abuse).
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
fingerprint

# Don't allow the TURN server to be used to reach private/internal hosts.
# This blocks attempts to use coturn as a port scanner inside the VPC.
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Quotas — adjust for your VM's resource budget. These limits are well
# below what an Oracle Ampere A1 free instance can handle.
total-quota=100
user-quota=12
max-bps=640000

# Log to stdout so docker compose logs are usable. Adjust verbosity via
# `--verbose` on the command line for debugging.
log-file=stdout
no-stdout-log
syslog
